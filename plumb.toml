[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Simplex CLI, frontend, HIR, x86_64 emitter, ELF64 linker and Fiber runtime workspace members."

[[layout.seat]]
path = "cases/*"
anchor = ["suite.toml"]
note = "Orthogonal golden .sx pass/reject specimen suites and exact rejection manifests."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.file]]
name = [".gitattributes"]
note = "Git attribute policy."

[[layout.file]]
name = ["DESIGN.md"]
note = "Simplex language design baseline, aesthetic laws and linux-x86_64 binary ABI contracts."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[identity]
ns = "simplex"

[[ectropy.grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[[ectropy.grant]]
paths = ["crates/cli/tests/**/*.rs"]
syntax = "process"
