[package]
name = "simplex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "simplex"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
plumb = { version = "0", registry = "perish", default-features = false }
simplex = { path = "../lib", version = "=0.0.0" }
